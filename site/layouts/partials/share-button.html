{{/* Behaviour lives in static/js/share.js. The span is an aria-live region, so screen readers announce "Link copied!". */}}
<div class="share">
  <button class="share-button" type="button" data-share-button aria-label="Share this post">
    <svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="5" r="3"></circle>
      <circle cx="6" cy="12" r="3"></circle>
      <circle cx="18" cy="19" r="3"></circle>
      <line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line>
      <line x1="15.4" y1="6.5" x2="8.6" y2="10.5"></line>
    </svg>
    Share
  </button>
  <span class="share__message" data-share-message role="status" aria-live="polite"></span>
</div>
